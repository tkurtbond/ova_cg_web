- name: Shady Teacher
  fragment: true
  background: |-
    The **Shady Teacher** is new to the school but seems to be
    knowledgeable enough. Yet there's something...off about him.
    Maybe it's because he wears sunglasses even indoors or that
    students are suspiciously disappearing from his class...
  abilities:
    - name: Art of Invisibility
      level: 2
    - name: Perceptive
      level: 2
    - name: Smart
      level: 3
  weaknesses:
    - name: Absent-Minded
      level: -1
    - name: Fussy
      level: -1
    - name: Quirk
      level: -1
      detail: Always Wears Sunglasses
    - name: Secret
      level: -2
      detail: To Everybody
- name: Snobbish Upperclassman
  fragment: true
  background: |-
    The **Snobbish Upperclassman** is the school's academic darling,
    the kendo team's star athlete, and easily the most popular girl
    on campus -- and she knows it. You'd be lucky if she gave you the
    time of day...or honored you by allowing you to tell it to her.
  abilities:
    - name: Agile
      level: 2
    - name: Beautiful
      level: 2
    - name: Knowledge
      level: 2
      detail: Kendo
    - name: Minions
      level: 2
      detail: Her Clique
    - name: Quick
      level: 2
    - name: Smart
      level: 2
  weaknesses:
    - name: Arrogant
      level: -2
    - name: Emotionless
      level: -1
    - name: Obsession
      level: -2
      detail: Meeting Her Mother's Lofty Expectations
    - name: Overconfident
      level: -2
    - name: Short-Tempered
      level: -1
