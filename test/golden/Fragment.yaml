    kendo team, and the most popular girl in school, and she's well
    aware of it. Don't expect her to give you the time of day.
  abilities:
    - name: Agile
      level: 2
    - name: Beautiful
      level: 2
    - name: Knowledge
      level: 2
      detail: Kendo
    - name: Minions
      level: 2
      detail: Her Clique
    - name: Quick
      level: 2
    - name: Smart
      level: 2
  weaknesses:
    - name: Arrogant
      level: -2
    - name: Emotionless
      level: -1
    - name: Obsession
      level: -2
      detail: Meeting Her Mother's Lofty Expectations
    - name: Overconfident
      level: -2
    - name: Short-Tempered
      level: -1
