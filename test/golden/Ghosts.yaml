    attacks can't touch them, so special powers -- or an exorcist --
    come in handy.
  abilities:
    - name: Attack
      level: 1
      detail: Haunt
      perks:
        - Fatiguing
    - name: Flight
      level: 1
    - name: Incorporeal Form
      level: 2
    - name: Resistance
      level: 5
      detail: Physical Attacks
    - name: Telekinesis
      level: 1
  weaknesses:
    - name: Bizarre Appearance
      level: -3
      detail: Ghostly
    - name: Restricted Freedom
      level: -3
      detail: Place of Death
